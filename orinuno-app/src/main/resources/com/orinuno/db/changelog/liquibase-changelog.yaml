# orinuno-app primary-DS changelog.
#
# Empty post-ADR-0021-§E2. After Block D3 retired the parse + decoder +
# Playwright + download surface and §E2 retired the calendar + reference +
# discovery slices, orinuno-app no longer owns ANY tables in its primary
# DS — the orinuno schema is empty. The per-source services
# (orinuno-source-kodik, orinuno-source-jutsu) own their L1 schemas; meter
# owns the L2 + L3 catalog schema; orinuno-app reads catalog via the
# meter-readonly DS (orinuno.catalog-read.url).
#
# The master is kept (rather than deleting outright) because Spring Boot's
# Liquibase auto-config still expects a change-log when
# spring.liquibase.enabled=true (default). Future migrations land here.
databaseChangeLog: []
