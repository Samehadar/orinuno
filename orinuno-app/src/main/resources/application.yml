server:
  port: ${APP_PORT:8080}

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: "health,prometheus,info"
  server:
    port: ${APP_ACTUATOR:8081}

spring:
  application:
    name: orinuno
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:orinuno}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  liquibase:
    change-log: classpath:com/orinuno/db/changelog/liquibase-changelog.yaml
    contexts: ${LIQUIBASE_CONTEXTS:default}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# ADR 0018 Phase 1.7 — kodik-sdk-spring-boot-starter consumes kodik.sdk.*. The
# env var contract is preserved verbatim; only the property tree shape moved
# from orinuno.kodik.* to kodik.sdk.* for the SDK-managed slice (rate limit +
# token subsystem). Non-SDK keys (api-url, request-delay-ms,
# validation-interval-minutes, catalog-ingestion gate) keep the orinuno.kodik
# prefix because OrinunoProperties still owns them.
kodik:
  sdk:
    rate-limit-per-minute: ${PARSE_RATE_LIMIT_PER_MINUTE:30}
    token:
      file: ${KODIK_TOKEN_FILE:./data/kodik_tokens.json}
      bootstrap-value: ${KODIK_TOKEN:}
      bootstrap-from-env: ${KODIK_TOKEN_BOOTSTRAP_FROM_ENV:true}
      auto-discovery-enabled: ${KODIK_TOKEN_AUTO_DISCOVERY_ENABLED:true}
      validate-on-startup: ${KODIK_TOKEN_VALIDATE_ON_STARTUP:true}
      dead-revalidation-interval-minutes: ${KODIK_TOKEN_DEAD_REVALIDATION_INTERVAL_MINUTES:1440}
      failover-max-attempts: ${KODIK_TOKEN_FAILOVER_MAX_ATTEMPTS:3}

orinuno:
  parse:
    rate-limit-per-minute: ${PARSE_RATE_LIMIT_PER_MINUTE:30}
    inbound-rate-limit:
      enabled: ${PARSE_INBOUND_RATE_LIMIT_ENABLED:true}
      requests-per-minute: ${PARSE_INBOUND_RATE_LIMIT_PER_MINUTE:60}
  security:
    api-key: ${ORINUNO_API_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  drift:
    enabled: ${ORINUNO_DRIFT_ENABLED:true}
    item-sampling:
      mode: ${ORINUNO_DRIFT_ITEM_SAMPLING_MODE:FIRST_N}
      limit: ${ORINUNO_DRIFT_ITEM_SAMPLING_LIMIT:10}
  providers:
    jutsu:
      base-url: ${JUTSU_BASE_URL:https://jut.su}
      username: ${JUTSU_USERNAME:}
      password: ${JUTSU_PASSWORD:}
      rate-limit-rps: ${JUTSU_RATE_LIMIT_RPS:1.0}
      session-ttl-minutes: ${JUTSU_SESSION_TTL_MINUTES:240}
      login-timeout-seconds: ${JUTSU_LOGIN_TIMEOUT_SECONDS:15}
      sync:
        enabled: ${JUTSU_SYNC_ENABLED:false}
        full-crawl:
          enabled: ${JUTSU_SYNC_FULL_CRAWL_ENABLED:false}
          interval-hours: ${JUTSU_SYNC_FULL_CRAWL_INTERVAL_HOURS:24}
          initial-delay-seconds: ${JUTSU_SYNC_FULL_CRAWL_INITIAL_DELAY_SECONDS:300}
          max-pages-per-tick: ${JUTSU_SYNC_FULL_CRAWL_MAX_PAGES_PER_TICK:30}
        notice-walk:
          enabled: ${JUTSU_SYNC_NOTICE_WALK_ENABLED:false}
          interval-minutes: ${JUTSU_SYNC_NOTICE_WALK_INTERVAL_MINUTES:15}
          initial-delay-seconds: ${JUTSU_SYNC_NOTICE_WALK_INITIAL_DELAY_SECONDS:60}
          max-feeds-per-tick: ${JUTSU_SYNC_NOTICE_WALK_MAX_FEEDS_PER_TICK:5}
          fetch-info-on-discovery: ${JUTSU_SYNC_NOTICE_WALK_FETCH_INFO_ON_DISCOVERY:false}
          max-info-fetches-per-tick: ${JUTSU_SYNC_NOTICE_WALK_MAX_INFO_FETCHES_PER_TICK:10}
        catalog-ingestion:
          enabled: ${JUTSU_SYNC_CATALOG_INGESTION_ENABLED:false}
      fallback:
        enabled: ${JUTSU_FALLBACK_ENABLED:true}
        rate-limit-rps: ${JUTSU_FALLBACK_RATE_LIMIT_RPS:0.5}
        circuit-breaker:
          window-size: ${JUTSU_FALLBACK_BREAKER_WINDOW_SIZE:20}
          failure-rate-threshold: ${JUTSU_FALLBACK_BREAKER_FAILURE_RATE:0.5}
          open-pause-seconds: ${JUTSU_FALLBACK_BREAKER_OPEN_PAUSE_S:60}
        negative-cache:
          ttl-seconds: ${JUTSU_FALLBACK_NEG_CACHE_TTL_S:30}
          max-size: ${JUTSU_FALLBACK_NEG_CACHE_MAX_SIZE:10000}

---
spring.config.activate.on-profile: local

logging:
  level:
    com.orinuno: ${LOG_LEVEL:DEBUG}
    org.springframework.web: ${WEB_LOG_LEVEL:WARN}

---
spring.config.activate.on-profile: prod

springdoc:
  swagger-ui.enabled: false
  api-docs.enabled: false
