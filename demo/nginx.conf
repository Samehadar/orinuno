server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve `app` on every request via Docker's embedded DNS (127.0.0.11).
    # nginx caches the upstream IP at startup by default, so after `docker compose
    # up -d --build app` (which re-issues the container with a fresh IP) the demo
    # holds the dead one and returns 502 until manually restarted.
    # Pinning a 30s TTL keeps lookup cost negligible while still picking up
    # container restarts within half a minute.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /api/ {
        # Variable-based upstream forces a per-request DNS resolution. Without
        # `$app`, nginx treats `app:8080` as a static address baked at config
        # parse time and never re-resolves.
        set $app "app:8080";
        proxy_pass http://$app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
