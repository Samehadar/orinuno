# ADR 0018 Phase 5.2a — meter owns the catalog_* schema in the shared catalog DB
# (orinuno_catalog). For now this is a parallel copy of the catalog_* changesets
# from orinuno-app/src/main/resources/com/orinuno/db/changelog/scripts/; fresh
# deploys creating the new `orinuno_catalog` schema get these tables applied by
# meter on startup. orinuno-app still owns the catalog_* tables in the legacy
# orinuno schema until Phase 5.4 cuts over the read-path and Phase 5.6 drops
# them from the orinuno schema.
#
# Liquibase tracks changesets by file path + author + id. Because meter's
# changelog lives under a different classpath (db/catalog-changelog/scripts/...
# vs com/orinuno/db/changelog/scripts/...), the same SQL applied from both
# modules to the same DB would be re-executed — which is why this changelog
# runs against a DIFFERENT schema (orinuno_catalog) than orinuno-app's
# (orinuno). The two schemas stay isolated until Phase 5.4 hands the read path
# over.
databaseChangeLog:
  - include:
      file: db/catalog-changelog/scripts/20260508030000_create_catalog_content.sql
  - include:
      file: db/catalog-changelog/scripts/20260508030100_create_catalog_content_external_id.sql
  - include:
      file: db/catalog-changelog/scripts/20260508030200_create_catalog_episode.sql
  - include:
      file: db/catalog-changelog/scripts/20260508030300_create_catalog_episode_source_link.sql
  - include:
      file: db/catalog-changelog/scripts/20260511020000_create_remote_source_watermark.sql
  # ADR 0021 Block B3-a — L2 episode_source + episode_video in meter (parallel
  # to the legacy orinuno.episode_source / orinuno.episode_video tables until
  # Block B1 cuts orinuno-app's dual-write off). FK on episode_source.content_id
  # retargets to catalog_content (same schema) since the legacy L2→L1 link via
  # kodik_content would be a cross-context FK.
  - include:
      file: db/catalog-changelog/scripts/20260512100000_create_episode_source.sql
  - include:
      file: db/catalog-changelog/scripts/20260512100100_create_episode_video.sql
