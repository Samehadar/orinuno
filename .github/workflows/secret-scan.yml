name: secret-scan

# Two-pass leak gate (betterleaks — drop-in gitleaks successor):
#   1. generic secret scan with the committed .gitleaks.toml (default rules)
#   2. forbidden-marker scan with a config injected from a repo secret
#      (GITLEAKS_KEYWORD_CONFIG_B64) — the marker list is NEVER committed.
# Mirrors the pinned-binary approach used in Samehadar/gohsite (the action
# variants gate on a license for orgs; the binary does not).
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  betterleaks:
    name: betterleaks (secrets + forbidden markers)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history for a complete scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install betterleaks (pinned + sha256-verified)
        run: |
          set -euo pipefail
          VERSION=1.6.0
          SHA256=d47a318a2e47c2eaf5e76691894765fa477deb60918fbcd1a0f09a9f006fadbd
          curl -sSfL -o bl.tar.gz \
            "https://github.com/betterleaks/betterleaks/releases/download/v${VERSION}/betterleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  bl.tar.gz" | sha256sum -c -
          tar -xzf bl.tar.gz betterleaks
          ./betterleaks version

      - name: Pass 1 — generic secret scan (committed config)
        run: ./betterleaks dir . --config .gitleaks.toml --redact --verbose

      - name: Pass 2 — forbidden-marker scan (config from secret)
        env:
          KW_B64: ${{ secrets.GITLEAKS_KEYWORD_CONFIG_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${KW_B64}" ]; then
            # Secret is unavailable to fork PRs. Fail on trusted events (push to
            # master / same-repo PR / manual); only soft-skip on fork PRs.
            if [ "${{ github.event_name }}" = "pull_request" ] \
               && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
              echo "::warning::forbidden-marker config secret not available to fork PR — skipping (maintainer re-run required)"
              exit 0
            fi
            echo "::error::GITLEAKS_KEYWORD_CONFIG_B64 secret missing on a trusted event"
            exit 1
          fi
          printf '%s' "${KW_B64}" | base64 -d > "${RUNNER_TEMP}/kw.toml"
          ./betterleaks dir . --config "${RUNNER_TEMP}/kw.toml" --redact --verbose
          rm -f "${RUNNER_TEMP}/kw.toml"
