# orinuno-source-kodik Liquibase changelog (ADR 0018 Phase 2.2).
#
# Duplicates the kodik_* + orinuno_parse_request migrations from orinuno-app so this
# service owns its own MySQL schema. Both modules can run against the historical content
# of these scripts independently (each has its own DATABASECHANGELOG tracking). The
# orinuno-app copies stay in place until the per-source mappers move out in Phase 2.3 —
# at that point the orinuno-app side can be pruned in a follow-up cleanup commit.
#
# NOT included: episode_source / episode_video (provider-agnostic L2; orinuno-app DB
# owns them until ADR 0018 Phase 5 moves them into the OSS meter shared catalog DB),
# backfill_episode_video_from_kodik_variant + drop_kodik_variant_l2_columns are
# Kodik-specific so DO ship here.
