services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orinuno
    ports:
      - "3316:3306"
    volumes:
      - orinuno-db:/var/lib/mysql
      # ADR 0018 Phase 2.9 — additional per-source schemas (orinuno_source_kodik)
      # are bootstrapped via init scripts; MYSQL_DATABASE only handles one.
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: app-runtime
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8085:8080"
      - "8086:8081"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: orinuno
      DB_USERNAME: root
      DB_PASSWORD: root
      KODIK_TOKEN: ${KODIK_TOKEN:-}
      KODIK_TOKEN_FILE: /app/data/kodik_tokens.json
      SPRING_PROFILES_ACTIVE: local
      # ADR 0018 Phase 2.8 — activate KodikUpstreamProxyFilter so /api/v1/kodik/*,
      # /api/v1/embed/*, /api/v1/reference/*, /api/v1/source-events/* forward to
      # the standalone service. Leave blank to keep orinuno-app's local controllers.
      ORINUNO_SOURCE_KODIK_BASE_URL: http://source-kodik:8086
      # ADR 0019 Phase 4.8 — activate JutsuUpstreamProxyFilter so
      # /api/v1/sources/jutsu/* + /api/v1/providers/jutsu/* forward to
      # orinuno-source-jutsu. Leave blank to keep orinuno-app's local
      # JutsuApiController + JutsuStreamProxyController.
      ORINUNO_SOURCE_JUTSU_BASE_URL: http://source-jutsu:8086
      # ADR 0021 §C1.4 — meter-readonly DS for MultiSourceController + the
      # CatalogContent / CatalogEpisode{Source,Video}ReadRepository slice.
      # Points at the same MySQL instance, orinuno_catalog schema (meter is
      # the writer). Production should swap the user to one with SELECT-only
      # grants per ADR 0018 Phase 5.9.
      ORINUNO_CATALOG_READ_URL: jdbc:mysql://db:3306/orinuno_catalog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      ORINUNO_CATALOG_READ_USERNAME: root
      ORINUNO_CATALOG_READ_PASSWORD: root
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # ADR 0018 Phase 5.1 — OSS meter, the catalog collector. Skeleton-only today;
  # Phase 5.2+ moves the catalog_* Liquibase changelogs over from orinuno-app and
  # turns meter into the single writer of the shared catalog schema. Currently it
  # boots a healthy actuator and does nothing else, so it stays as a no-op service
  # in the stack — keeps the docker-compose contract stable for the upcoming work.
  meter:
    build:
      context: .
      target: meter-runtime
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8089:8089"
      - "8090:8090"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: orinuno_catalog
      DB_USERNAME: root
      DB_PASSWORD: root
      # Phase 5.5 / Phase 4.11 — per-source service URLs that meter's
      # *RemoteEventPoller beans hit. Phase 4.11 lands the jut.su poller; until
      # then the JUTSU url is just declared so the env contract is set.
      ORINUNO_SOURCE_KODIK_BASE_URL: http://source-kodik:8086
      ORINUNO_SOURCE_JUTSU_BASE_URL: http://source-jutsu:8086
    restart: unless-stopped

  # ADR 0018 Phase 2 — orinuno-source-kodik standalone deployable. Owns the
  # kodik_* schema and serves /api/v1/kodik/*, /api/v1/embed/*, /api/v1/reference/*,
  # /api/v1/source-events/* directly. `app` reverse-proxies these routes here.
  source-kodik:
    build:
      context: .
      target: source-kodik-runtime
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8087:8086"
      - "8088:8087"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: orinuno_source_kodik
      DB_USERNAME: root
      DB_PASSWORD: root
      KODIK_TOKEN: ${KODIK_TOKEN:-}
      KODIK_TOKEN_FILE: /app/data/kodik_tokens.json
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # ADR 0019 Phase 4 — orinuno-source-jutsu standalone deployable. Owns the
  # jutsu_* schema and serves /api/v1/sources/jutsu/*, /api/v1/providers/jutsu/*,
  # /api/v1/source-events/* directly. `app` reverse-proxies these routes here
  # when ORINUNO_SOURCE_JUTSU_BASE_URL is set.
  source-jutsu:
    build:
      context: .
      target: source-jutsu-runtime
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8091:8086"
      - "8092:8087"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: orinuno_source_jutsu
      DB_USERNAME: root
      DB_PASSWORD: root
      # Credentials for jut.su premium decode. Reuses the same JUTSU_*
      # env names as orinuno-app's application.yml so a single .env covers
      # both legacy in-process + standalone paths.
      JUTSU_USERNAME: ${JUTSU_USERNAME:-}
      JUTSU_PASSWORD: ${JUTSU_PASSWORD:-}
      JUTSU_BASE_URL: ${PROVIDERS_JUTSU_BASE_URL:-${JUTSU_BASE_URL:-https://jut.su}}
    restart: unless-stopped

  demo:
    build: ./demo
    depends_on:
      - app
    ports:
      # Pin IPv4-only. Docker Desktop on macOS binds `[::]:PORT` too by default,
      # but the IPv6 NAT path mis-routes cascading proxy hops (demo nginx → app
      # container DNS), so browsers that resolve `localhost` to `::1` first hit
      # a 502. Forcing `127.0.0.1:` makes the IPv6 listener absent → browser
      # falls through to IPv4 → request succeeds.
      - "127.0.0.1:3000:80"
    environment:
      VITE_API_URL: ""
      VITE_API_KEY: ""

  # ────────────────────────────────────────────────────────────────────
  # Local observability stack — Prometheus scrapes orinuno's actuator
  # endpoint at app:8081/actuator/prometheus, Grafana ships pre-loaded
  # with the "orinuno — parse requests" dashboard. Both opt-in via the
  # `observability` profile so plain `docker compose up` stays minimal.
  #
  # Run with metrics:
  #   docker compose --profile observability up
  #
  # URLs (after start):
  #   Prometheus → http://localhost:9090
  #   Grafana    → http://localhost:3001  (admin / admin)
  # ────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.2
    profiles: ["observability"]
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

  # ────────────────────────────────────────────────────────────────────
  # ARCH-0017-FOLLOWUP-POSTER manual smoke profile. Spins up MinIO + a
  # WireMock instance impersonating Kin's meter-api so we can run the
  # full poster pipeline end-to-end on a developer laptop without
  # connecting to the private downstream-repo meter service. Used by
  # downstream-repo/scripts/e2e-poster-smoke.sh.
  #
  # Run with:
  #   docker compose --profile e2e-poster up -d
  #
  # URLs (after start):
  #   MinIO S3       → http://localhost:9000  (corporate / corporate-secret)
  #   MinIO console  → http://localhost:9001
  #   mock-meter     → http://localhost:9999  (POST /v1/content-export/)
  # ────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    profiles: ["e2e-poster"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: corporate
      MINIO_ROOT_PASSWORD: corporate-secret
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    profiles: ["e2e-poster"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 corporate corporate-secret; do sleep 1; done;
        mc mb --ignore-existing local/corporate-test;
        mc anonymous set public local/corporate-test;
        echo "MinIO bucket corporate-test ready";

  mock-meter:
    image: wiremock/wiremock:3.13.2
    profiles: ["e2e-poster"]
    ports:
      - "9999:8080"
    volumes:
      - ./scripts/e2e-poster/wiremock:/home/wiremock
    command: ["--global-response-templating", "--verbose"]

volumes:
  orinuno-db:
  prometheus-data:
  grafana-data:
