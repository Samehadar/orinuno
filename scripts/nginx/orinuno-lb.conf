# ADR 0018 Phase 5.8 — nginx load balancer for multi-instance orinuno deploys.
#
# Used by the docker-compose `lb` service. Routes external traffic on host
# :8084 → upstream `app` containers in round-robin. Docker compose's internal
# DNS resolves `app` to all running replicas when --scale app=N is used,
# nginx's resolver re-pulls the list on every request → no restart on scale.
#
# Per-instance Caffeine cache means consumers may see up to
# orinuno.catalog.cache.expire-after-write-seconds (default 300s) of lag
# between instances. Acceptable for catalog reads; documented in ADR 0018
# Phase 5.8.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker compose internal DNS — refresh upstream every 10s so newly
    # scaled instances start receiving traffic without nginx reload.
    resolver 127.0.0.11 valid=10s;

    log_format combined_short '$remote_addr - "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log combined_short;

    upstream orinuno_app {
        # `app` is the docker-compose service name; resolver picks up replicas.
        server app:8080 max_fails=2 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Pass through everything; orinuno-app does its own routing.
        location / {
            proxy_pass http://orinuno_app;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            proxy_read_timeout  60s;
            proxy_connect_timeout 5s;
        }

        # Cheap nginx-side health endpoint so the LB itself is independently
        # probable.
        location = /lb-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
